<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IFRI MentorLink{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
          rel="stylesheet">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-people-fill me-2"></i>IFRI MentorLink
            </a>
            <div class="ms-auto">
                {% if current_user.is_authenticated %}
                    <span class="navbar-text text-white me-3">
                        {{ current_user.prenom }} {{ current_user.nom }}
                    </span>
                    <a href="{{ url_for('auth.deconnexion') }}"
                       class="btn btn-outline-light btn-sm">
                        Déconnexion
                    </a>
                {% else %}
                    <a href="{{ url_for('auth.connexion') }}"
                       class="btn btn-outline-light btn-sm me-2">
                        Connexion
                    </a>
                    <a href="{{ url_for('auth.inscription') }}"
                       class="btn btn-light btn-sm">
                        Inscription
                    </a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Contenu principal -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
