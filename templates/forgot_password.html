<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié - IFRI MentorLink</title>
    
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="container">
        <div class="row justify-content-center">
            
            <div class="col-12 col-sm-8 col-md-6 col-lg-4">
                
                <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                    <div class="card-body text-center">
                        
                        <i class="fas fa-key text-primary fa-3x mb-3"></i>
                        
                        <h3 class="fw-bold text-dark">Mot de passe oublié ?</h3>
                        <p class="text-muted small mb-4">Saisissez l'adresse email liée à votre compte étudiant IFRI pour recevoir un lien de réinitialisation.</p>
                        
                        <form action="/login" method="GET">
                            
                            <div class="form-group text-start mb-3">
                                <label class="form-label small fw-bold text-secondary">Adresse Email Institutionnelle</label>
                                <input type="email" name="email_recup" class="form-control form-control-lg rounded-3" placeholder="exemple@ifri.uac.bj" required>
                            </div>
                            
                            <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3 fw-bold fs-6 shadow-sm mb-3">Envoyer le lien</button>
                        </form>
                        
                        <a href="/login" class="text-decoration-none small fw-bold"><i class="fas fa-arrow-left me-2"></i>Retour à la connexion</a>
                        
                    </div>
                </div>
                
            </div>
        </div>
    </div>

</body>
</html>
