<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>IFRI MentorLink</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="{{ url_for('dashboard') }}">
                <i class="fas fa-graduation-cap"></i> IFRI MentorLink
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('dashboard') }}">Tableau de bord</a>
                <a class="nav-link" href="{{ url_for('messages') }}">Messagerie</a>
                <a class="nav-link" href="{{ url_for('settings') }}">Paramètres</a>
                <a class="nav-link text-danger" href="{{ url_for('logout') }}">Déconnexion</a>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
