{% extends "base.html" %}
{% block content %}
<div class="row">
    <div class="col-md-4">
        <div class="card shadow-sm border-0 p-4">
            <h5>Profil</h5>
            {% if user %}
                <p>Bienvenue, {{ user.prenom }}</p>
            {% else %}
                <p class="text-muted">Aucune session active.</p>
            {% endif %}
        </div>
    </div>
    <div class="col-md-8">
        <div class="card shadow-sm border-0 p-4">
            <h5>Mentors recommandés</h5>
            <p class="text-muted">En attente de connexion à la base de données.</p>
        </div>
    </div>
</div>
{% endblock %}
