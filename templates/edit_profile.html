{% extends "base.html" %}

{% block content %}
<div class="row g-4 m-0 w-100">
    <div class="col-12">
        
        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
            <div class="card-body">
                
                <div class="text-center mb-4">
                    <i class="fas fa-user-edit text-primary fa-2x mb-2"></i>
                    <h3 class="fw-bold text-dark">Modifier mon profil</h3>
                    <p class="text-muted small">Gérez vos informations personnelles et vos critères de mentorat</p>
                </div>

                <form action="/dashboard" method="GET">
                    
                    <h5 class="fw-bold text-primary mb-3"><i class="fas fa-id-card me-2"></i>Informations personnelles</h5>
                    
                    <div class="row align-items-center g-3 mb-4">
                        <div class="col-12 col-md-2 text-center">
                            <div class="position-relative d-inline-block">
                                <div class="bg-primary text-white d-flex align-items-center justify-content-center rounded-circle fw-bold shadow-sm mx-auto" style="width: 90px; height: 90px; font-size: 2rem;">
                                    CD
                                </div>
                                <label for="avatarUpload" class="position-absolute bottom-0 end-0 bg-white text-primary rounded-circle shadow-sm d-flex align-items-center justify-content-center" style="width: 32px; height: 32px; cursor: pointer;">
                                    <i class="fas fa-camera size-sm"></i>
                                </label>
                                <input type="file" id="avatarUpload" name="photo_profil" class="d-none" accept="image/*">
                            </div>
                        </div>
                        
                        <div class="col-12 col-md-10">
                            <div class="row g-3">
                                <div class="col-12 col-sm-6">
                                    <label class="form-label small fw-bold text-secondary">Prénom</label>
                                    <input type="text" name="prenom" class="form-control bg-light rounded-3" value="Charnel">
                                </div>
                                <div class="col-12 col-sm-6">
                                    <label class="form-label small fw-bold text-secondary">Nom</label>
                                    <input type="text" name="nom" class="form-control bg-light rounded-3" value="DAKOU">
                                </div>
                                <div class="col-12">
                                    <label class="form-label small fw-bold text-secondary">Adresse Email</label>
                                    <input type="email" class="form-control bg-light rounded-3" value="charnel.dakou@exemple.com" disabled>
                                </div>
                            </div>
                        </div>
                    </div>

                    <hr class="text-muted my-4">

                    <h5 class="fw-bold text-primary mb-3"><i class="fas fa-graduation-cap me-2"></i>Profil académique & Mentorat</h5>
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary">Mes compétences (Points forts)</label>
                        <textarea name="competences" class="form-control bg-light rounded-3" rows="3" placeholder="Ex: HTML/CSS, Design UI, Bootstrap..."></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary">Mes lacunes (Besoins d'aide)</label>
                        <textarea name="lacunes" class="form-control bg-light rounded-3" rows="3" placeholder="Ex: Algorithmique, Analyse mathématique..."></textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-bold text-secondary">Mes disponibilités horaires</label>
                        <input type="text" name="disponibilites" class="form-control bg-light rounded-3" placeholder="Ex: Week-ends, Soirs après 17h...">
                    </div>

                    <hr class="text-muted my-4">

                    <h5 class="fw-bold text-primary mb-3"><i class="fas fa-lock me-2"></i>Sécurité</h5>
                    
                    <div class="row g-3 mb-4">
                        <div class="col-12 col-md-6">
                            <label class="form-label small fw-bold text-secondary">Nouveau mot de passe</label>
                            <input type="password" name="nouveau_password" class="form-control bg-light rounded-3" placeholder="Laisser vide pour ne pas changer">
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label small fw-bold text-secondary">Confirmer le mot de passe</label>
                            <input type="password" name="confirm_password" class="form-control bg-light rounded-3" placeholder="Répéter le nouveau mot de passe">
                        </div>
                    </div>

                    <div class="d-flex gap-3 pt-2">
                        <a href="/dashboard" class="btn btn-light btn-lg w-50 rounded-3 fw-bold fs-6">Annuler</a>
                        <button type="submit" class="btn btn-primary btn-lg w-50 rounded-3 fw-bold fs-6 shadow-sm">Sauvegarder les modifications</button>
                    </div>
                </form>
                
            </div>
        </div>
        
    </div>
</div>
{% endblock %}
