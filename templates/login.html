<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion - IFRI MentorLink</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="card shadow-sm border-0 p-4" style="width: 400px;">
        <h3 class="text-center mb-4 fw-bold text-primary">Connexion</h3>
        
        <form action="{{ url_for('login') }}" method="POST">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Mot de passe</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-3">Se connecter</button>
            
            <div class="text-center">
                <p class="small mb-1">
                    <a href="{{ url_for('forgot_password') }}">Mot de passe oublié ?</a>
                </p>
                <p class="small">
                    Pas encore de compte ? <a href="{{ url_for('register') }}">Créer un compte</a>
                </p>
            </div>
        </form>
    </div>
</body>
</html>
