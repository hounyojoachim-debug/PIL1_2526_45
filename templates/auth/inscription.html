{% extends "base.html" %}
{% block title %}Inscription — IFRI MentorLink{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5 mb-5">
    <div class="col-md-8 col-lg-7">
        <div class="card shadow border-0">
            <div class="card-header bg-primary text-white py-3">
                <h5 class="mb-0">
                    <i class="fas fa-user-plus me-2"></i>Créer un compte
                </h5>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('auth.inscription') }}" novalidate>

                    <!-- Nom + Prénom -->
                    <div class="row mb-3">
                        <div class="col-md-6 mb-3 mb-md-0">
                            <label for="nom" class="form-label fw-semibold">
                                Nom <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control" id="nom" name="nom"
                                   placeholder="AMADOU" required>
                        </div>
                        <div class="col-md-6">
                            <label for="prenom" class="form-label fw-semibold">
                                Prénom <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control" id="prenom" name="prenom"
                                   placeholder="Tobie" required>
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">
                            Email <span class="text-danger">*</span>
                        </label>
                        <input type="email" class="form-control" id="email" name="email"
                               placeholder="ton.email@exemple.com" required>
                    </div>

                    <!-- Téléphone -->
                    <div class="mb-3">
                        <label for="telephone" class="form-label fw-semibold">
                            Téléphone <span class="text-danger">*</span>
                        </label>
                        <input type="tel" class="form-control" id="telephone" name="telephone"
                               placeholder="97000000" required>
                    </div>

                    <!-- Filière + Niveau -->
                    <div class="row mb-3">
                        <div class="col-md-6 mb-3 mb-md-0">
                            <label for="filiere" class="form-label fw-semibold">
                                Filière <span class="text-danger">*</span>
                            </label>
                            <select class="form-select" id="filiere" name="filiere" required>
                                <option value="" disabled selected>Choisir...</option>
                                <option value="IA">IA — Intelligence Artificielle</option>
                                <option value="IM">IM — Informatique et Mathématiques</option>
                                <option value="GL">GL — Génie Logiciel</option>
                                <option value="SE">SE — Sécurité et IoT</option>
                                <option value="SI">SI — Systèmes d'Information</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="niveau" class="form-label fw-semibold">
                                Niveau <span class="text-danger">*</span>
                            </label>
                            <select class="form-select" id="niveau" name="niveau" required>
                                <option value="" disabled selected>Choisir...</option>
                                <option value="L1">L1</option>
                                <option value="L2">L2</option>
                                <option value="L3">L3</option>
                                <option value="M1">M1</option>
                                <option value="M2">M2</option>
                            </select>
                        </div>
                    </div>

                    <!-- Mot de passe -->
                    <div class="mb-3">
                        <label for="mot_de_passe" class="form-label fw-semibold">
                            Mot de passe <span class="text-danger">*</span>
                        </label>
                        <input type="password" class="form-control" id="mot_de_passe"
                               name="mot_de_passe" minlength="8" required>
                        <div class="form-text">8 caractères minimum.</div>
                    </div>

                    <!-- Confirmation -->
                    <div class="mb-4">
                        <label for="mot_de_passe_confirm" class="form-label fw-semibold">
                            Confirmer le mot de passe <span class="text-danger">*</span>
                        </label>
                        <input type="password" class="form-control" id="mot_de_passe_confirm"
                               name="mot_de_passe_confirm" required>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            Créer mon compte
                        </button>
                    </div>

                </form>
            </div>
            <div class="card-footer text-center py-3 text-muted small">
                Déjà un compte ?
                <a href="{{ url_for('auth.connexion') }}" class="fw-semibold">
                    Se connecter
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
